<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo: runde Klickbereiche für Inselstaaten</title>
<style>
  :root{--bg:#0e1621;--card:#152233;--line:#26384f;--ink:#e8eef6;--mut:#8da2ba;--sea:#3f86c9;--land:#e7d9b2;--bord:#9b8a62;--area:#1d9e75;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif;padding:12px}
  h1{font-size:18px;margin:0 0 4px}
  p.sub{margin:0 0 12px;color:var(--mut);max-width:72ch}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 12px;color:var(--mut);font-size:12px;align-items:center}
  .legend i{display:inline-block;width:20px;height:11px;vertical-align:middle;margin-right:6px;border:1.5px dashed var(--area);background:rgba(29,158,117,.25);border-radius:6px}
  .legend b{display:inline-block;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid #334;vertical-align:middle;margin-right:6px}
  .controls{margin:0 0 12px;display:flex;gap:8px;flex-wrap:wrap}
  .controls button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
  .controls button.on{border-color:var(--area);background:rgba(29,158,117,.2)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .tile svg{display:block;width:100%;height:auto;background:var(--sea)}
  .tile .cap{padding:7px 10px}
  .tile .name{font-weight:600}
  .tile .note{color:var(--mut);font-size:12px}
  .hit{fill:rgba(29,158,117,.0);stroke:none}
  .zone{fill:rgba(29,158,117,.26);stroke:#0f7a58;stroke-width:2.2;stroke-dasharray:7 4}
  body.nozone .zone{display:none}
  body.zoneonly .dotring{display:none}
</style>
</head>
<body>
<h1>Runde Klickbereiche für Inselstaaten</h1>
<p class="sub">So könnte es aussehen: Statt nur den winzigen Punkt zu treffen, klickt man irgendwo in die runde Fläche um die Inselgruppe. Der weiße Punkt ist das, was heute klickbar ist.</p>
<div class="legend"><span><b></b>heutiger Klickpunkt</span><span><i></i>neuer Klickbereich</span></div>
<div class="controls">
  <button id="bBoth" class="on">Punkt + Bereich</button>
  <button id="bDot">nur Punkt (heute)</button>
  <button id="bZone">nur Bereich (neu)</button>
</div>
<div id="grid" class="grid"></div>
<script src="../vendor/d3.v7.min.js"></script>
<script src="../vendor/topojson.v3.min.js"></script>
<script src="../countries.js"></script>
<script>
(async function(){
  const world=await fetch('../data/countries-50m.json').then(r=>r.json());
  const land=topojson.feature(world,world.objects.countries);
  const borders=topojson.mesh(world,world.objects.countries,(a,b)=>a!==b);
  const W=360,H=250;
  // Inselstaaten mit verstreuten oder winzigen Inseln
  const IDS=[583,584,296,798,585,242,776,882,548,90,462,690,174,132,44];
  const dotOf=id=>MICROSTATES.find(m=>m.id===id);
  const km=(a,b)=>{const R=6371,r=Math.PI/180,dl=(b[1]-a[1])*r,dn=(b[0]-a[0])*r;const x=Math.sin(dl/2)**2+Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x));};
  function coordsOf(f){const out=[];(function walk(c){if(typeof c[0]==='number')out.push(c);else c.forEach(walk);})(f.geometry.coordinates);return out;}
  function chaikin(p,n){for(let r=0;r<n;r++){const q=[];for(let k=0;k<p.length;k++){const a=p[k],b=p[(k+1)%p.length];q.push([.75*a[0]+.25*b[0],.75*a[1]+.25*b[1]],[.25*a[0]+.75*b[0],.25*a[1]+.75*b[1]]);}p=q;}return p;}
  const grid=document.getElementById('grid');
  IDS.filter(id=>C[id]).forEach(id=>{
    const dot=dotOf(id);
    let pts=land.features.filter(f=>+f.id===id).flatMap(coordsOf);
    let source='aus den Karten-Umrissen';
    if(dot&&pts.length)pts=pts.filter(p=>km([p[0],p[1]],[dot.lon,dot.lat])<900); // nur die Hauptgruppe (z. B. Gilbert-Inseln bei Kiribati)
    if(!pts.length){pts=dot?[[dot.lon,dot.lat]]:[];source='nur Punkt (kein Umriss in den Daten)';}
    if(!pts.length)return;
    // Kartenausschnitt: Gruppe in der Mitte, Platz drumherum; Datumsgrenze über Rotation lösen
    let lo=d3.mean(pts,p=>p[0]);
    // Kreismittel für Längengrade (Datumsgrenze)
    const sx=d3.sum(pts,p=>Math.sin(p[0]*Math.PI/180)),cx=d3.sum(pts,p=>Math.cos(p[0]*Math.PI/180));
    lo=Math.atan2(sx,cx)*180/Math.PI;
    const la=d3.mean(pts,p=>p[1]);
    let proj=d3.geoMercator().rotate([-lo,0]).translate([0,0]).scale(1);
    const probe=pts.map(p=>proj(p)),xs=probe.map(p=>p[0]),ys=probe.map(p=>p[1]);
    let w=Math.max(...xs)-Math.min(...xs),h=Math.max(...ys)-Math.min(...ys);
    const minSpan=0.035; // mindestens ca. 6° Ausschnitt bei winzigen Gruppen
    w=Math.max(w,minSpan);h=Math.max(h,minSpan*0.7);
    const k=Math.min(W*0.46/w,H*0.46/h);
    const cxp=(Math.max(...xs)+Math.min(...xs))/2,cyp=(Math.max(...ys)+Math.min(...ys))/2;
    proj=d3.geoMercator().rotate([-lo,0]).scale(k).translate([W/2-cxp*k,H/2-cyp*k]);
    const path=d3.geoPath(proj);
    // Bereich: kleinster Kreis, der alle Inseln der Gruppe einschließt, plus etwas Rand. Ein echter
    // Kreis (keine Ellipse, kein abgerundetes Vieleck); winzige Gruppen bekommen einen Mindestradius,
    // damit man sie noch gut treffen kann.
    const px=pts.map(p=>proj(p));
    const enc=d3.packEnclose(px.map(p=>({x:p[0],y:p[1],r:0})));
    const rPx=Math.max(enc.r*1.12+10,26);
    const zoneD=null,zc={x:enc.x,y:enc.y,r:rPx};
    const dc=dot?proj([dot.lon,dot.lat]):proj([pts[0][0],pts[0][1]]);
    const tile=document.createElement('div');tile.className='tile';
    tile.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${C[id].de}">
      <path d="${path(land)}" fill="var(--land)"/>
      <path d="${path(borders)}" fill="none" stroke="var(--bord)" stroke-width=".6"/>
      <circle class="zone" cx="${zc.x}" cy="${zc.y}" r="${zc.r}"/>
      <g class="dotring"><circle cx="${dc[0]}" cy="${dc[1]}" r="4.5" fill="#fff" stroke="#233" stroke-width="2"/></g>
    </svg>
    <div class="cap"><div class="name">${C[id].de}</div><div class="note">${source}</div></div>`;
    grid.appendChild(tile);
  });
  const set=m=>{document.body.className=m;['bBoth','bDot','bZone'].forEach(i=>document.getElementById(i).classList.remove('on'));document.getElementById(m==='nozone'?'bDot':m==='zoneonly'?'bZone':'bBoth').classList.add('on');};
  document.getElementById('bBoth').onclick=()=>set('');
  document.getElementById('bDot').onclick=()=>set('nozone');
  document.getElementById('bZone').onclick=()=>set('zoneonly');
})();
</script>
</body>
</html>
