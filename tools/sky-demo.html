<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Himmel-Varianten</title>
<style>
  body{margin:0;background:#0b0e14;color:#dce6f0;font:14px/1.4 system-ui,sans-serif;padding:14px;}
  h1{font-size:18px;margin:0 0 4px;} p{margin:0 0 12px;color:#8fa3b8;font-size:13px;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .tile{border-radius:10px;overflow:hidden;background:#000;border:1px solid #223;}
  .sky{position:relative;aspect-ratio:4/3;background-size:cover;background-position:center;}
  .globe{position:absolute;height:84%;left:50%;top:50%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle at 38% 34%,#6fb0e6 0,#4a90cc 45%,#2d6aa6 100%);box-shadow:inset -12px -10px 28px rgba(0,0,0,.35);overflow:hidden;}
  .globe i{position:absolute;background:#e0d4b4;border-radius:46% 54% 50% 50%;opacity:.95}
  .cap{padding:6px 9px;display:flex;flex-direction:column;background:#10151f;}
  .cap b{font-size:14px;} .cap span{color:#8fa3b8;font-size:12px;}
</style></head><body>
<h1>Milchstraße im Fokus – schwärzerer Hintergrund</h1>
<p>Der Himmel steht hinter der Kugel (hier nur als Platzhalter-Kugel). Welche Variante gefällt dir?</p>
<div class="grid" id="g"></div>
<script src="../sky.js"></script>
<script>
const only=['milchstrasse','schwarz','kontrast','tiefschwarz','schwarzblau'];
const desc={milchstrasse:'bisher (Vergleich)',schwarz:'Grund reines Schwarz, Band wie bisher',kontrast:'Schwarz, Band klarer, weniger Dunst drumherum',tiefschwarz:'Schwarz, Band eng und hell, kaum Dunst',schwarzblau:'wie Kontrast, mit minimalem Blauton am Rand',aktuell:'wie jetzt: viele Sterne, Milchstraße',dezent:'knapp ein Drittel der Sterne, kleiner, ohne Glanz',milchstrasse:'wenige Sterne, Milchstraße breit und hell',nebel:'fast keine Sterne, violetter Nebel',tiefblau:'tiefblauer Verlauf, kaum Sterne',ruhig:'fast leer, nur ein paar Sterne'};
const g=document.getElementById('g');
(async()=>{for(const [k,p] of Object.entries(Sky.PRESETS)){if(!only.includes(k))continue;
  const url=Sky.build(900,k);
  g.insertAdjacentHTML('beforeend','<div class="tile"><div class="sky" style="background-image:url('+url+')"><div class="globe"><i style="left:22%;top:18%;width:30%;height:34%"></i><i style="left:48%;top:50%;width:24%;height:30%"></i><i style="left:12%;top:58%;width:22%;height:26%"></i></div></div><div class="cap"><b>'+p.label+'</b><span>'+(desc[k]||'')+'</span></div></div>');
  await new Promise(r=>setTimeout(r,10));}})();
</script></body></html>
